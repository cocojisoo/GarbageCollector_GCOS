[project]
name = "gcos"
version = "0.1.0"
description = "GCOS — Garbage Collector OS for LLM. A userspace mini-OS that manages LLM agents as processes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.54.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "sse-starlette>=2.1.3",
    "rich>=13.9.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
sandbox = ["docker>=7.1.0"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0"]

[project.scripts]
gcos = "gcos.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gcos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
